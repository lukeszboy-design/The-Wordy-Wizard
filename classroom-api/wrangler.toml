# The Wordy Wizard classroom service. Publish with:  npx wrangler deploy   (from this folder)
name = "wordy-wizard-classroom"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[[kv_namespaces]]
binding = "CLASSES"
id = "399a0aff845c453e9b4e243d604444ac"

# MeloTTS reads spelling words aloud (Workers AI)
[ai]
binding = "AI"

# The Wizard's Tale: one coordinator per story, so a story is written once and each sentence recorded once,
# however many devices ask for it at the same moment (Durable Objects are on the free plan)
[[durable_objects.bindings]]
name = "WRITER"
class_name = "StoryWriter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["StoryWriter"]
