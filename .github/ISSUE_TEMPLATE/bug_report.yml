name: Bug report
description: Something isn't working right
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      placeholder: Typing 3 - 5 shows 2 instead of -2.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen instead?
  - type: input
    id: where
    attributes:
      label: Where did it happen?
      placeholder: Chrome on Mac, iPad Safari, Windows app...
  - type: textarea
    id: notes
    attributes:
      label: Screenshots or notes
